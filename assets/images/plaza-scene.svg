<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Illustration of an upscale shopping plaza at golden hour with string lights and a lively crowd of families and friends gathering">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#173f49"/>
      <stop offset="40%" stop-color="#3a6168"/>
      <stop offset="70%" stop-color="#c98a5a"/>
      <stop offset="88%" stop-color="#eab978"/>
      <stop offset="100%" stop-color="#f6d9a0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe7b4" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffd089" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd089" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ece0cb"/>
      <stop offset="100%" stop-color="#d6c4a6"/>
    </linearGradient>
    <radialGradient id="floorlight" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#f6ecd7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f6ecd7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="win" width="64" height="58" patternUnits="userSpaceOnUse">
      <rect width="64" height="58" fill="none"/>
      <rect x="15" y="13" width="26" height="30" rx="3" fill="#f4c878" opacity="0.9"/>
    </pattern>
    <pattern id="awn" width="30" height="12" patternUnits="userSpaceOnUse">
      <rect width="30" height="12" fill="#bd6440"/>
      <rect width="15" height="12" fill="#ecdcb2"/>
    </pattern>
  </defs>

  <!-- Sky & sun -->
  <rect x="0" y="0" width="1600" height="560" fill="url(#sky)"/>
  <circle cx="1060" cy="450" r="430" fill="url(#sun)"/>

  <!-- Background buildings -->
  <g>
    <rect x="60" y="330" width="360" height="212" rx="6" fill="#0c3a46"/>
    <rect x="76" y="346" width="328" height="150" fill="url(#win)"/>
    <rect x="520" y="298" width="560" height="244" rx="6" fill="#103f4b"/>
    <rect x="536" y="314" width="528" height="172" fill="url(#win)"/>
    <rect x="1140" y="326" width="384" height="216" rx="6" fill="#0c3a46"/>
    <rect x="1156" y="342" width="352" height="150" fill="url(#win)"/>
  </g>

  <!-- Storefront awnings on the central building -->
  <g>
    <path d="M548,504 H672 L660,530 H560 Z" fill="url(#awn)"/>
    <path d="M712,504 H836 L824,530 H724 Z" fill="url(#awn)"/>
    <path d="M876,504 H1000 L988,530 H888 Z" fill="url(#awn)"/>
    <rect x="540" y="528" width="472" height="14" fill="#0a2f39"/>
  </g>

  <!-- Festoon string lights -->
  <g>
    <path d="M80,72 C350,180 1250,180 1520,70" fill="none" stroke="#0a2f39" stroke-width="2" opacity="0.55"/>
    <g fill="#ffe2a0">
      <g opacity="0.9">
        <line x1="80"   y1="72"  x2="80"   y2="84"  stroke="#0a2f39" stroke-width="1.5"/>
        <circle cx="80"   cy="90"  r="6"/>
        <line x1="178"  y1="101" x2="178"  y2="113" stroke="#0a2f39" stroke-width="1.5"/>
        <circle cx="178"  cy="119" r="6"/>
        <line x1="308"  y1="124" x2="308"  y2="136" stroke="#0a2f39" stroke-width="1.5"/>
        <circle cx="308"  cy="142" r="6"/>
        <line x1="459"  y1="140" x2="459"  y2="152" stroke="#0a2f39" stroke-width="1.5"/>
        <circle cx="459"  cy="158" r="6"/>
        <line x1="626"  y1="150" x2="626"  y2="162" stroke="#0a2f39" stroke-width="1.5"/>
        <circle cx="626"  cy="168" r="6"/>
        <line x1="800"  y1="153" x2="800"  y2="165" stroke="#0a2f39" stroke-width="1.5"/>
        <circle cx="800"  cy="171" r="6"/>
        <line x1="974"  y1="149" x2="974"  y2="161" stroke="#0a2f39" stroke-width="1.5"/>
        <circle cx="974"  cy="167" r="6"/>
        <line x1="1141" y1="139" x2="1141" y2="151" stroke="#0a2f39" stroke-width="1.5"/>
        <circle cx="1141" cy="157" r="6"/>
        <line x1="1292" y1="123" x2="1292" y2="135" stroke="#0a2f39" stroke-width="1.5"/>
        <circle cx="1292" cy="141" r="6"/>
        <line x1="1421" y1="100" x2="1421" y2="112" stroke="#0a2f39" stroke-width="1.5"/>
        <circle cx="1421" cy="118" r="6"/>
        <line x1="1520" y1="70"  x2="1520" y2="82"  stroke="#0a2f39" stroke-width="1.5"/>
        <circle cx="1520" cy="88"  r="6"/>
      </g>
      <g fill="#fff3d4" opacity="0.5">
        <circle cx="80" cy="90" r="11"/><circle cx="308" cy="142" r="11"/><circle cx="626" cy="168" r="11"/>
        <circle cx="974" cy="167" r="11"/><circle cx="1292" cy="141" r="11"/><circle cx="1520" cy="88" r="11"/>
      </g>
    </g>
  </g>

  <!-- Ground -->
  <rect x="0" y="540" width="1600" height="360" fill="url(#ground)"/>
  <ellipse cx="800" cy="600" rx="760" ry="220" fill="url(#floorlight)"/>
  <path d="M0,560 H1600" stroke="#cbb893" stroke-width="2" opacity="0.5"/>

  <!-- Trees in planters -->
  <g>
    <rect x="146" y="470" width="10" height="74" fill="#6b4a2f"/>
    <circle cx="151" cy="452" r="42" fill="#2f6b50"/>
    <circle cx="126" cy="470" r="30" fill="#357a5b"/>
    <circle cx="176" cy="468" r="30" fill="#2c6249"/>
    <rect x="120" y="540" width="62" height="16" rx="4" fill="#b9a47e"/>
  </g>
  <g>
    <rect x="1452" y="470" width="10" height="74" fill="#6b4a2f"/>
    <circle cx="1457" cy="452" r="42" fill="#2f6b50"/>
    <circle cx="1432" cy="470" r="30" fill="#357a5b"/>
    <circle cx="1482" cy="468" r="30" fill="#2c6249"/>
    <rect x="1426" y="540" width="62" height="16" rx="4" fill="#b9a47e"/>
  </g>

  <!-- Crowd -->
  <g>
    <!-- back row -->
    <g transform="translate(360,586) scale(0.85)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.10"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#14606f"/><circle cx="0" cy="-76" r="11" fill="#e0ac69"/></g>
    <g transform="translate(470,582) scale(0.8)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.10"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#c8a96a"/><circle cx="0" cy="-76" r="11" fill="#c68642"/></g>
    <g transform="translate(985,586) scale(0.85)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.10"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#c0653f"/><circle cx="0" cy="-76" r="11" fill="#f1c27d"/></g>
    <g transform="translate(1120,583) scale(0.82)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.10"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#6a4a6e"/><circle cx="0" cy="-76" r="11" fill="#a86b3c"/></g>
    <!-- mid row -->
    <g transform="translate(300,642) scale(1.05)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.12"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#e8dcc5"/><circle cx="0" cy="-76" r="11" fill="#c68642"/></g>
    <g transform="translate(560,646) scale(1.1)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.12"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#0f4c5c"/><circle cx="0" cy="-76" r="11" fill="#e0ac69"/></g>
    <g transform="translate(722,650) scale(1.12)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.12"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#b08d4f"/><circle cx="0" cy="-76" r="11" fill="#8d5524"/></g>
    <g transform="translate(884,646) scale(1.1)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.12"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#c0653f"/><circle cx="0" cy="-76" r="11" fill="#f1c27d"/></g>
    <g transform="translate(1180,642) scale(1.05)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.12"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#14606f"/><circle cx="0" cy="-76" r="11" fill="#a86b3c"/></g>
    <!-- front row -->
    <g transform="translate(430,708) scale(1.3)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.14"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#5e4470"/><circle cx="0" cy="-76" r="11" fill="#e0ac69"/></g>
    <g transform="translate(1020,710) scale(1.32)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.14"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#c8a96a"/><circle cx="0" cy="-76" r="11" fill="#c68642"/></g>
    <g transform="translate(1300,702) scale(1.28)"><ellipse cx="0" cy="2" rx="15" ry="4" opacity="0.14"/><path d="M-12,0 L-13,-44 C-13,-56 -7,-64 0,-64 C7,-64 13,-56 13,-44 L12,0 Z" fill="#0f4c5c"/><circle cx="0" cy="-76" r="11" fill="#8d5524"/></g>
  </g>
</svg>
